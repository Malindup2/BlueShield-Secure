# V9 — Black-box brute-force PoC (OWASP A07:2021, CWE-307)
#
# Floods POST /api/auth/login with failed password guesses against a single
# account. On the vulnerable baseline every request is answered 401 with no
# throttling: the Artillery summary shows http.codes.401 == total requests and
# no http.codes.429. After the rate-limit / lockout fix, a large share of
# requests should return 429 instead.
#
# Run:  npx artillery run tests/performance/v09-bruteforce.yml
config:
  target: "http://localhost:5000"
  phases:
    - duration: 20
      arrivalRate: 25
      name: "Credential brute-force burst"
  defaults:
    headers:
      Content-Type: "application/json"

scenarios:
  - name: "Login brute-force (single victim account)"
    flow:
      - post:
          url: "/api/auth/login"
          json:
            email: "victim@blueshield.com"
            password: "wrong-password-guess"
